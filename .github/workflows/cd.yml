name: CD

on:
  workflow_dispatch:

run-name: 'Publish package to NuGet.org'

env:
  WORKING_DIR:         '${{ github.workspace }}' # 'D:\a\DesktopFlyouts\DesktopFlyouts'
  WASDK_APP_PROJ_PATH: '${{ github.workspace }}\src\DesktopFlyouts.Wasdk\DesktopFlyouts.Wasdk.csproj'
  UWP_APP_PROJ_PATH:   '${{ github.workspace }}\src\DesktopFlyouts.Uwp\DesktopFlyouts.Uwp.csproj'
  UNO_LIB_PROJ_PATH:  '${{ github.workspace }}\src\DesktopFlyouts.Uno\DesktopFlyouts.Uno.csproj'
  OUTPUT_DIR:          '${{ github.workspace }}\artifacts'

jobs:
  build-pack-publish:
    runs-on: windows-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          9.0.x
          10.0.x
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: '0x5bfa'

    - name: Pack the project (WASDK)
      run: dotnet build $env:WASDK_APP_PROJ_PATH -c Release -a x64 -o $env:OUTPUT_DIR

    - name: Pack the project (UWP)
      run: dotnet build $env:UWP_APP_PROJ_PATH   -c Release -a x64 -o $env:OUTPUT_DIR

    - name: Pack the project (Uno)
      run: dotnet build $env:UNO_LIB_PROJ_PATH   -c Release -a x64 -o $env:OUTPUT_DIR

    - name: Upload nupkg artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NuPkg artifacts
        path: |
          ${{ env.OUTPUT_DIR }}\*.nupkg
          ${{ env.OUTPUT_DIR }}\*.snupkg

    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ${{ env.OUTPUT_DIR }}\*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
        dotnet nuget push ${{ env.OUTPUT_DIR }}\*.snupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
