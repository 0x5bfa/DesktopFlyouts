name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'PR validation' || 'CI validation' }}

env:
  SOLUTION_PATH: 'DesktopFlyouts.slnx'

jobs:
  x64:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    - name: Build solution
      run: msbuild /restore $env:SOLUTION_PATH /t:Build /p:Configuration=$env:CONFIGURATION /p:Platform=x64 /m

    - name: Run C++ unit tests
      shell: pwsh
      run: |
        $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
        & $vstest ".\x64\$env:CONFIGURATION\DesktopFlyouts.WinUI.Tests.dll" ".\x64\$env:CONFIGURATION\DesktopFlyouts.Uwp.Tests.dll" /Platform:x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run C# projection unit tests
      shell: pwsh
      run: |
        dotnet test tests/DesktopFlyouts.WinUI.Projection.Tests/DesktopFlyouts.WinUI.Projection.Tests.csproj --no-build --no-restore -p:Platform=x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test tests/DesktopFlyouts.Uwp.Projection.Tests/DesktopFlyouts.Uwp.Projection.Tests.csproj --no-build --no-restore -p:Platform=x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Setup WinApp CLI
      if: matrix.configuration == 'Debug'
      uses: microsoft/setup-WinAppCli@v0.1

    - name: Run UWP then WinUI runtime integration tests
      if: matrix.configuration == 'Debug'
      run: |
        winapp run tests/DesktopFlyouts.Uwp.IntegrationTests/bin/x64/Debug/net10.0-windows10.0.26100.0/win-x64 --manifest tests/DesktopFlyouts.Uwp.IntegrationTests/bin/x64/Debug/net10.0-windows10.0.26100.0/win-x64/AppxManifest.xml --exe DesktopFlyouts.Uwp.IntegrationTests.exe --with-alias --unregister-on-exit
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        winapp run tests/DesktopFlyouts.WinUI.IntegrationTests/bin/x64/Debug/net10.0-windows10.0.26100.0/win-x64 --manifest tests/DesktopFlyouts.WinUI.IntegrationTests/bin/x64/Debug/net10.0-windows10.0.26100.0/win-x64/AppxManifest.xml --exe DesktopFlyouts.WinUI.IntegrationTests.exe --with-alias --unregister-on-exit
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  arm64:
    runs-on: windows-11-vs2026-arm
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    - name: Build solution
      run: msbuild /restore $env:SOLUTION_PATH /t:Build /p:Configuration=$env:CONFIGURATION /p:Platform=arm64 /m

    - name: Run C++ unit tests
      shell: pwsh
      run: |
        $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
        & $vstest ".\ARM64\$env:CONFIGURATION\DesktopFlyouts.WinUI.Tests.dll" ".\ARM64\$env:CONFIGURATION\DesktopFlyouts.Uwp.Tests.dll" /Platform:ARM64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run C# projection unit tests
      shell: pwsh
      run: |
        dotnet test tests/DesktopFlyouts.WinUI.Projection.Tests/DesktopFlyouts.WinUI.Projection.Tests.csproj --no-build --no-restore -p:Platform=arm64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test tests/DesktopFlyouts.Uwp.Projection.Tests/DesktopFlyouts.Uwp.Projection.Tests.csproj --no-build --no-restore -p:Platform=arm64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Setup WinApp CLI
      if: matrix.configuration == 'Debug'
      uses: microsoft/setup-WinAppCli@v0.1

    - name: Run UWP then WinUI runtime integration tests
      if: matrix.configuration == 'Debug'
      run: |
        winapp run tests/DesktopFlyouts.Uwp.IntegrationTests/bin/ARM64/Debug/net10.0-windows10.0.26100.0/win-arm64 --manifest tests/DesktopFlyouts.Uwp.IntegrationTests/bin/ARM64/Debug/net10.0-windows10.0.26100.0/win-arm64/AppxManifest.xml --exe DesktopFlyouts.Uwp.IntegrationTests.exe --with-alias --unregister-on-exit
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        winapp run tests/DesktopFlyouts.WinUI.IntegrationTests/bin/ARM64/Debug/net10.0-windows10.0.26100.0/win-arm64 --manifest tests/DesktopFlyouts.WinUI.IntegrationTests/bin/ARM64/Debug/net10.0-windows10.0.26100.0/win-arm64/AppxManifest.xml --exe DesktopFlyouts.WinUI.IntegrationTests.exe --with-alias --unregister-on-exit
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
