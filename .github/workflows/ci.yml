name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'PR validation' || 'CI validation' }}

env:
  SOLUTION_PATH: 'DesktopFlyouts.slnx'

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    - name: Build solution
      run: msbuild /restore $env:SOLUTION_PATH /t:Build /p:Configuration=$env:CONFIGURATION /p:Platform=x64 /m

    - name: Validate native WinRT contracts
      shell: pwsh
      run: |
        .\tests\Test-NativeWinRTContract.ps1 -WinmdPath @(
          ".\x64\$env:CONFIGURATION\DesktopFlyouts.WinUI\DesktopFlyouts.winmd",
          ".\x64\$env:CONFIGURATION\DesktopFlyouts.Uwp\DesktopFlyouts.winmd"
        )

    - name: Validate C# projection contracts
      shell: pwsh
      run: .\tests\Test-CSharpProjectionContract.ps1 -Configuration $env:CONFIGURATION -Platform x64
