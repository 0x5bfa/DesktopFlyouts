name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'PR validation' || 'CI validation' }}

env:
  SOLUTION_PATH: 'DesktopFlyouts.slnx'

jobs:
  x64:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    - name: Add VSTest to PATH
      shell: pwsh
      run: |
        $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
        if (-not $vstest) { throw 'VSTest.Console.exe was not found in the Visual Studio installation.' }
        Split-Path -Parent $vstest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build solution
      run: msbuild /restore $env:SOLUTION_PATH /t:Build /p:Configuration=$env:CONFIGURATION /p:Platform=x64 /m

    - name: Run C++ unit tests
      shell: pwsh
      run: |
        vstest.console.exe ".\x64\$env:CONFIGURATION\DesktopFlyouts.WinUI.Tests.dll" ".\x64\$env:CONFIGURATION\DesktopFlyouts.Uwp.Tests.dll" /Platform:x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run C# projection unit tests
      shell: pwsh
      run: |
        dotnet test tests/DesktopFlyouts.WinUI.Projection.Tests/DesktopFlyouts.WinUI.Projection.Tests.csproj --no-build --no-restore -p:Platform=x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test tests/DesktopFlyouts.Uwp.Projection.Tests/DesktopFlyouts.Uwp.Projection.Tests.csproj --no-build --no-restore -p:Platform=x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run UWP runtime integration tests
      if: matrix.configuration == 'Debug'
      shell: pwsh
      run: |
        $recipe = ".\tests\DesktopFlyouts.Uwp.IntegrationTests\bin\x64\$env:CONFIGURATION\net10.0-windows10.0.26100.0\DesktopFlyouts.Uwp.IntegrationTests.build.appxrecipe"
        if (-not (Test-Path -LiteralPath $recipe)) { throw "UWP test recipe was not found: $recipe" }
        & vstest.console.exe $recipe /Platform:x64 /Framework:frameworkuap10
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run WinUI runtime integration tests
      if: matrix.configuration == 'Debug'
      shell: pwsh
      run: |
        $recipe = ".\tests\DesktopFlyouts.WinUI.IntegrationTests\bin\x64\$env:CONFIGURATION\net10.0-windows10.0.26100.0\DesktopFlyouts.WinUI.IntegrationTests.build.appxrecipe"
        if (-not (Test-Path -LiteralPath $recipe)) { throw "WinUI test recipe was not found: $recipe" }
        & vstest.console.exe $recipe /Platform:x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  arm64:
    runs-on: windows-11-vs2026-arm
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    - name: Add VSTest to PATH
      shell: pwsh
      run: |
        $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
        if (-not $vstest) { throw 'VSTest.Console.exe was not found in the Visual Studio installation.' }
        Split-Path -Parent $vstest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build solution
      run: msbuild /restore $env:SOLUTION_PATH /t:Build /p:Configuration=$env:CONFIGURATION /p:Platform=arm64 /m

    - name: Run C++ unit tests
      shell: pwsh
      run: |
        vstest.console.exe ".\ARM64\$env:CONFIGURATION\DesktopFlyouts.WinUI.Tests.dll" ".\ARM64\$env:CONFIGURATION\DesktopFlyouts.Uwp.Tests.dll" /Platform:ARM64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run C# projection unit tests
      shell: pwsh
      run: |
        dotnet test tests/DesktopFlyouts.WinUI.Projection.Tests/DesktopFlyouts.WinUI.Projection.Tests.csproj --no-build --no-restore -p:Platform=arm64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test tests/DesktopFlyouts.Uwp.Projection.Tests/DesktopFlyouts.Uwp.Projection.Tests.csproj --no-build --no-restore -p:Platform=arm64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run UWP runtime integration tests
      if: matrix.configuration == 'Debug'
      shell: pwsh
      run: |
        $recipe = ".\tests\DesktopFlyouts.Uwp.IntegrationTests\bin\arm64\$env:CONFIGURATION\net10.0-windows10.0.26100.0\DesktopFlyouts.Uwp.IntegrationTests.build.appxrecipe"
        if (-not (Test-Path -LiteralPath $recipe)) { throw "UWP test recipe was not found: $recipe" }
        & vstest.console.exe $recipe /Platform:ARM64 /Framework:frameworkuap10
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run WinUI runtime integration tests
      if: matrix.configuration == 'Debug'
      shell: pwsh
      run: |
        $recipe = ".\tests\DesktopFlyouts.WinUI.IntegrationTests\bin\arm64\$env:CONFIGURATION\net10.0-windows10.0.26100.0\DesktopFlyouts.WinUI.IntegrationTests.build.appxrecipe"
        if (-not (Test-Path -LiteralPath $recipe)) { throw "WinUI test recipe was not found: $recipe" }
        & vstest.console.exe $recipe /Platform:ARM64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
