name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/assets/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.github/assets/**'
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'DesktopFlyouts PR Validation' || 'DesktopFlyouts CI Validation' }}

env:
  WORKING_DIR:           '${{ github.workspace }}' # 'D:\a\DesktopFlyouts\DesktopFlyouts'
  SOLUTION_PATH:         '${{ github.workspace }}\DesktopFlyouts.slnx'
  WINUI_PROJ_PATH:       '${{ github.workspace }}\samples\DesktopFlyouts.SampleApp.WinUI\DesktopFlyouts.SampleApp.WinUI.csproj'
  UWP_PROJ_PATH:         '${{ github.workspace }}\samples\DesktopFlyouts.SampleApp.Uwp\DesktopFlyouts.SampleApp.Uwp.csproj'
  UNO_PROJ_PATH:         '${{ github.workspace }}\samples\DesktopFlyouts.SampleApp.Uno\DesktopFlyouts.SampleApp.Uno.csproj'
  WINUI_TEST_PROJ_PATH:  '${{ github.workspace }}\tests\DesktopFlyouts.UnitTests.WinUI\DesktopFlyouts.UnitTests.WinUI.csproj'
  UWP_TEST_PROJ_PATH:    '${{ github.workspace }}\tests\DesktopFlyouts.UnitTests.Uwp\DesktopFlyouts.UnitTests.Uwp.csproj'

jobs:

  winui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, ARM64]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Build the sample app
      run: msbuild /restore $env:WINUI_PROJ_PATH /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM

    - name: Build the tests
      run: msbuild /restore $env:WINUI_TEST_PROJ_PATH /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM
    - name: Run the tests
      run: dotnet test --project $env:WINUI_TEST_PROJ_PATH -c $env:CONFIGURATION -p:Platform=$env:PLATFORM --no-build

  uwp:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, ARM64]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Build the sample app
      run: msbuild /restore $env:UWP_PROJ_PATH /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM

    - name: Build the tests
      run: msbuild /restore $env:UWP_TEST_PROJ_PATH /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM
    - name: Run the tests
      run: msbuild $env:UWP_TEST_PROJ_PATH /t:InvokeTestingPlatform /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM

  uno:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, arm64] # requires lowercase for Uno
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Build the sample app
      run: |
        dotnet restore $env:UNO_PROJ_PATH
        dotnet build $env:UNO_PROJ_PATH -c $env:CONFIGURATION -a $env:PLATFORM --no-restore
