name: DesktopFlyouts CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/assets/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.github/assets/**'
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'DesktopFlyouts PR Validation' || 'DesktopFlyouts CI Validation' }}

env:
  WORKING_DIR:           '${{ github.workspace }}' # 'D:\a\DesktopFlyouts\DesktopFlyouts'
  SOLUTION_PATH:         '${{ github.workspace }}\DesktopFlyouts.slnx'
  WINUI_PROJ_PATH:       '${{ github.workspace }}\samples\DesktopFlyouts.SampleApp.WinUI\DesktopFlyouts.SampleApp.WinUI.csproj'
  UWP_PROJ_PATH:         '${{ github.workspace }}\samples\DesktopFlyouts.SampleApp.Uwp\DesktopFlyouts.SampleApp.Uwp.csproj'
  UNO_PROJ_PATH:         '${{ github.workspace }}\samples\DesktopFlyouts.SampleApp.Uno\DesktopFlyouts.SampleApp.Uno.csproj'

jobs:
  test-windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flavor: [WinUI, Uwp]
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x
    - name: Enable developer mode for test deployment
      shell: pwsh
      run: |
        $developerModeKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
        New-Item -Path $developerModeKey -Force | Out-Null
        New-ItemProperty -Path $developerModeKey -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
    - name: Build ${{ matrix.flavor }} tests
      run: msbuild /restore tests/DesktopFlyouts.UnitTests.${{ matrix.flavor }}/DesktopFlyouts.UnitTests.${{ matrix.flavor }}.csproj /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false
    - name: Run ${{ matrix.flavor }} tests
      shell: pwsh
      run: |
        $testProject = 'DesktopFlyouts.UnitTests.${{ matrix.flavor }}'
        $recipes = @(Get-ChildItem "tests/$testProject/bin/x64/Release" -Filter "$testProject.build.appxrecipe" -File -Recurse)
        if ($recipes.Count -ne 1) { throw 'Expected exactly one test application build recipe.' }
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        $vstest = & $vswhere -latest -products * -find 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe'
        if ($LASTEXITCODE -ne 0 -or -not $vstest) { throw 'Visual Studio VSTest tools were not found.' }
        & $vstest $recipes[0].FullName /Platform:x64 /Framework:FrameworkUap10 /InIsolation /Logger:trx '/ResultsDirectory:tests/TestResults/${{ matrix.flavor }}' -- RunConfiguration.TreatNoTestsAsError=true
        exit $LASTEXITCODE
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: UnitTests-${{ matrix.flavor }}
        path: tests/TestResults/${{ matrix.flavor }}/*.trx
        if-no-files-found: ignore

  build-winui:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, ARM64]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Build the sample app
      run: msbuild /restore $env:WINUI_PROJ_PATH /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM /p:AppxBundle=Never

  build-uwp:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, ARM64]
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Build the sample app
      run: msbuild /restore $env:UWP_PROJ_PATH /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM /p:AppxBundle=Never

  build-uno:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, arm64] # requires lowercase for Uno
    env:
      CONFIGURATION: ${{ matrix.configuration }}
      PLATFORM: ${{ matrix.platform }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Build the sample app
      run: |
        dotnet restore $env:UNO_PROJ_PATH
        dotnet build $env:UNO_PROJ_PATH -c $env:CONFIGURATION -a $env:PLATFORM --no-restore
