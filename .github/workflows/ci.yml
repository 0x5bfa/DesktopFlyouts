name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'PR validation' || 'CI validation' }}

env:
  SOLUTION_PATH: 'DesktopFlyouts.slnx'

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    - name: Build solution
      run: msbuild /restore $env:SOLUTION_PATH /t:Build /p:Configuration=$env:CONFIGURATION /p:Platform=x64 /m

    - name: Run C++ unit tests
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vstest = & $vswhere -latest -products '*' -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
        if (-not $vstest) { throw 'vstest.console.exe was not found in the Visual Studio installation.' }

        & $vstest `
          ".\x64\$env:CONFIGURATION\DesktopFlyouts.WinUI.Tests.dll" `
          ".\x64\$env:CONFIGURATION\DesktopFlyouts.Uwp.Tests.dll" `
          /Platform:x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run C# projection unit tests
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vstest = & $vswhere -latest -products '*' -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
        if (-not $vstest) { throw 'vstest.console.exe was not found in the Visual Studio installation.' }

        $testRoot = ".\tests"
        $testAssemblies = @(
          Get-ChildItem "$testRoot\DesktopFlyouts.WinUI.Projection.Tests\bin\x64\$env:CONFIGURATION" -Recurse -Filter 'DesktopFlyouts.WinUI.Projection.Tests.dll'
          Get-ChildItem "$testRoot\DesktopFlyouts.Uwp.Projection.Tests\bin\x64\$env:CONFIGURATION" -Recurse -Filter 'DesktopFlyouts.Uwp.Projection.Tests.dll'
        )
        if ($testAssemblies.Count -ne 2) { throw "Expected both C# projection test assemblies; found $($testAssemblies.Count)." }

        foreach ($testAssembly in $testAssemblies) {
          & $vstest $testAssembly.FullName "/TestAdapterPath:$($testAssembly.DirectoryName)" /Platform:x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

  arm64-tests:
    runs-on: windows-11-vs2026-arm
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CONFIGURATION: ${{ matrix.configuration }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    - name: Build ARM64 solution
      run: msbuild /restore $env:SOLUTION_PATH /t:Build /p:Configuration=$env:CONFIGURATION /p:Platform=arm64 /m

    - name: Run ARM64 C++ unit tests
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vstest = & $vswhere -latest -products '*' -find 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe' | Select-Object -First 1
        if (-not $vstest) { throw 'vstest.console.exe was not found in the Visual Studio installation.' }

        & $vstest `
          ".\ARM64\$env:CONFIGURATION\DesktopFlyouts.WinUI.Tests.dll" `
          ".\ARM64\$env:CONFIGURATION\DesktopFlyouts.Uwp.Tests.dll" `
          /Platform:ARM64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
